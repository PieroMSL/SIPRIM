[project]
name = "siprim"
version = "0.1.0"
description = "SIPRIM backend for municipal investment project prioritization"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "SQLAlchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "celery[redis]>=5.4,<6.0",
  "PyJWT>=2.10,<3.0",
  "argon2-cffi>=23.1,<26.0",
  "pytest>=8.3,<9.0",
  "httpx>=0.28,<1.0",
  "google-genai>=1.75,<2.0",
  "langgraph>=0.6,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-q"
