name: Validacion IA API
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'requirements.txt'
      - 'scripts/verify_ia_live.py'
      - '.github/workflows/ia-api.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest --junitxml=artifacts/pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-ia-api-tests
          path: artifacts/pytest.xml
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:ia
      - run: npm run build
      - run: npm run lint
